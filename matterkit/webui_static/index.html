<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Matter Kit</title>
<link rel="stylesheet" href="/app.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<a class="skip" href="#main" id="skip">Skip to the case</a>
<div class="shell">
  <aside class="side" aria-label="Cases">
    <div class="brand" id="brand">Matter Kit</div>
    <nav aria-label="Cases in this workspace" id="cases"></nav>
    <div id="new-case"></div>
    <p class="disclaimer">Not legal advice. Matter Kit organizes your case. It doesn't file anything, and sends nothing unless you turn on case law lookups.</p>
  </aside>
  <main id="main" tabindex="-1"></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
