name: corpus-open
version: "0.6.0"
manifest_version: 2
api_version: 1
description: >-
  Corpus Open's matter kit inside Hermes. A citation guard lists every case, statute and
  code cite under each reply with what CourtListener, Corpus and your case file hold at it
  (FOUND, NOT FOUND, NAME DIFFERS, IN CORPUS), so a made-up cite is flagged before it reaches
  a filing. Twelve tools read and keep a local case folder (labeled facts with sources,
  deadlines and triggers, brief check, counsel packet, court rules, hash verification), a
  deadline brief opens each session, /matter shows status, deadlines and the packet, and in
  Hermes Desktop a Case pane shows deadlines (passed first), a tamper badge for the case's files
  and how many facts have no source.
  Network calls are only cite checks, on by default for each case: bare case cites such as
  550 U.S. 544 go to CourtListener, only when a key is set, and bare statute and code cites such
  as 42 U.S.C. § 2000e-3(a) go to Corpus (corpuslaw.us). Nothing else goes anywhere. Each check
  can be turned off per case, and off sticks; citation_guard local keeps every cite on this
  computer. Nothing is filed, sent or shared.
author: Corpus (teakesdev)
license: Apache-2.0
homepage: https://github.com/teakesdev/corpus-open
tags: [legal, citations, litigation, pro-se, deadlines, matter]
requires_hermes: ">=0.21.6"
provides_tools:
  - matter_status
  - matter_fact_add
  - matter_fact_list
  - matter_deadline_list
  - matter_trigger_list
  - matter_trigger_fire
  - matter_packet_render
  - matter_brief_check
  - matter_rules_show
  - matter_cite_check
  - matter_verify
  - matter_ingest_path
provides_hooks:
  - pre_llm_call
  - transform_llm_output
  - pre_tool_call
requires_env: []
config_schema:
  matter_dir:
    type: str
    default: ""
    description: >-
      Your case folder, made with /matter init or /matter demo. The tools, the deadline brief
      and the cite checks (on by default, turned off per case there) all read it.
  citation_guard:
    type: str
    default: lookup
    choices: [lookup, local, "off"]
    description: >-
      lookup sends bare cites to CourtListener (case cites, once a key is set) and Corpus
      (statute and code cites) unless a person turned that check off for the case; local lists
      cites without any network call; off turns the guard off.
  caller_id:
    type: str
    default: hermes
    description: >-
      The name this plugin uses in the case's lookup log and consent checks. The cite checks
      cover every caller; only a grant a person limited to named callers looks at it.
  deadline_window_days:
    type: int
    default: 14
    description: How far ahead the session's deadline brief looks.
  max_statute_checks:
    type: int
    default: 5
    description: Most statute and code cites looked up on Corpus per reply.
  source_guard:
    type: bool
    default: true
    description: >-
      Stop Hermes's file tools from changing a registered source document or the case store
      (.matter/), and ask you first when a command looks like it would.
  quote_guard:
    type: bool
    default: true
    description: >-
      Before Hermes writes a draft in the case folder, check each quotation and record page cite
      against the cited document's text, and refuse the write when a quotation is not in the
      document or is on a different page than cited.
  courtlistener_token:
    type: secret
    env: COURTLISTENER_TOKEN
    required: false
    description: >-
      Free CourtListener API key for checking case cites (get one at
      https://www.courtlistener.com/profile/api/). Without it case cites are listed but not looked
      up; statute and code cites need no key. Hermes keeps it in your profile's .env file.
  corpus_api_key:
    type: secret
    env: CORPUS_API_KEY
    required: false
    description: Optional Corpus API key (corpuslaw.us/settings); anonymous search works without one.
